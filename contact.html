<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact – Sol Studio</title>

  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/nav.css" />
  <link rel="stylesheet" href="./css/contact.css" />
</head>

<body>

<!-- Global navigation -->
<nav class="site-nav" aria-label="Primary navigation">
  <a href="./index.html" class="site-nav__logo" aria-label="Sol Studio home">
    <img src="./Branding/solstudiocutout.png" alt="Sol Studio sun">
    <span class="site-nav__logo-text">Sol Studio</span>
  </a>
  <div class="site-nav__menu">
    <span class="site-nav__menu-label">Menu</span>
    <ul class="site-nav__links">
      <li><a href="./gallery.html">Gallery</a></li>
      <li><a href="./prints.html">Prints</a></li>
      <li><a href="./about.html">About</a></li>
      <li><a href="./contact.html" aria-current="page">Contact</a></li>
    </ul>
  </div>
</nav>

  <main class="page">
    <div class="container">
      <section class="grid" aria-labelledby="contact-title">
        <div class="left">
          <header class="header">
            <h1 id="contact-title">Contact</h1>
            <p class="subtext">Leave a note and I’ll get back to you!</p>
          </header>

          <form class="form" id="contact-form">
            <input type="hidden" name="_subject" value="New Sol Studio contact form submission" />
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" autocomplete="name" required />
            </div>

            <div class="field">
              <label for="email">Email Address</label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>

            <div class="field">
              <label for="inquiry">Subject</label>
              <input id="inquiry" name="inquiry" type="text" autocomplete="off" />
            </div>

            <div class="field field--message">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="7" required></textarea>
            </div>

            <div class="actions">
              <button class="btn" type="submit">Send it</button>
            </div>
          </form>
        </div>

        <div class="right">
          <figure class="photo">
            <img src="./about_photos/DSC_4474.jpg" alt="Contact page photo" />
          </figure>
        </div>
      </section>

      <footer class="footer" aria-label="Sol Studio">
        <img class="sun" src="./Branding/solstudiocutout.png" alt="Sol Studio sun logo" />
      </footer>
    </div>
  </main>

  <script>
    document.getElementById('contact-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);
      const res = await fetch('https://formspree.io/f/mkovgqrd', {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
      });
      if (res.ok) {
        window.location.href = '/thank_you.html';
      } else {
        alert('Something went wrong. Please try again.');
      }
    });
  </script>
</body>
</html>
