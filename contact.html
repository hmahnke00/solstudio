<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact – Sol Studio</title>

  <link rel="stylesheet" href="./css/contact.css" />
</head>

<body>
  <main class="page">
    <div class="container">
      <section class="grid" aria-labelledby="contact-title">
        <div class="left">
          <header class="header">
            <h1 id="contact-title">Contact</h1>
            <p class="subtext">Leave a note and I’ll get back to you!</p>
          </header>

          <form class="form" method="POST" action="https://formspree.io/f/mkovgqrd">
            <input type="hidden" name="_subject" value="New Sol Studio contact form submission" />
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" autocomplete="name" required />
            </div>

            <div class="field">
              <label for="email">Email Address</label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>

            <div class="field">
              <label for="inquiry">Subject</label>
              <input id="inquiry" name="inquiry" type="text" autocomplete="off" />
            </div>

            <div class="field field--message">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="7" required></textarea>
            </div>

            <div class="actions">
              <button class="btn" type="submit">Send it</button>
            </div>
          </form>
        </div>

        <div class="right">
          <figure class="photo">
            <img src="./about_photos/DSC_4474.jpg" alt="Contact page photo" />
          </figure>
        </div>
      </section>

      <footer class="footer" aria-label="Sol Studio">
        <img class="sun" src="./Branding/solstudiocutout.png" alt="Sol Studio sun logo" />
      </footer>
    </div>
  </main>
</body>
</html>
