<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery · Sol Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Slackside+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/style_gallery.css?v=8">

  <!-- Apply saved theme before page renders -->
  <script src="./js/theme-toggle.js"></script>
</head>
<body>

  <button id="theme-toggle" aria-label="Switch to dark mode">Dark</button>

  <!-- Header: logo left, filters right -->
  <header class="gallery-header">
    <a href="index.html" class="gallery-logo" aria-label="Sol Studio home">
      <img src="Branding/solstudiocutout.png" alt="Sol Studio">
    </a>
    <nav class="filter-bar" id="filter-bar" aria-label="Filter by series">
      <button class="filter-btn is-active" data-filter="*">All</button>
      <button class="filter-btn" data-filter=".contact">Contact</button>
      <button class="filter-btn" data-filter=".small">Small</button>
      <button class="filter-btn" data-filter=".witness">Witness</button>
    </nav>
  </header>

  <!-- Gallery grid — populated by gallery.js -->
  <main class="gallery-grid" id="gallery-grid">
    <!-- column width sizer for Isotope masonry -->
    <div class="grid-sizer"></div>
  </main>

  <script src="./js/gallery.js?v=4"></script>
</body>
</html>
