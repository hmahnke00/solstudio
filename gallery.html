<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery · Sol Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Slackside+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/style_gallery.css?v=9">

  <!-- Apply saved theme before page renders -->
  <script src="./js/theme-toggle.js"></script>
</head>
<body>

  <button id="theme-toggle" aria-label="Switch to dark mode">Dark</button>

  <header class="gallery-header">
    <a href="index.html" class="gallery-logo" aria-label="Sol Studio home">
      <img src="Branding/solstudiocutout.png" alt="Sol Studio">
    </a>
  </header>

  <section class="gallery-section">
    <main class="gallery-grid" id="gallery-grid"></main>
  </section>

  <!-- Lightbox overlay -->
  <div class="lightbox" id="lightbox" aria-modal="true" role="dialog" hidden>
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">×</button>
    <button class="lightbox-prev" id="lightbox-prev" aria-label="Previous photo">‹</button>
    <button class="lightbox-next" id="lightbox-next" aria-label="Next photo">›</button>
    <img class="lightbox-img" id="lightbox-img" alt="">
  </div>

  <script src="./js/gallery-data.js"></script>
  <script src="./js/gallery.js?v=6"></script>
</body>
</html>
